<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="480" height="480">
  <!-- Education Galaxy Point: an open book (education) from which a spiral
       galaxy rises, turning around one bright point at its core — and a
       guiding star above it for the students who rise to the top. -->
  <g fill="none" stroke="#1f2a44" stroke-linecap="round" stroke-linejoin="round">
    <!-- galaxy: two spiral arms around the point -->
    <path d="M60 48 C 69 36, 89 37, 92 50 C 95 63, 78 73, 62 70" stroke-width="3.4"/>
    <path d="M60 48 C 51 60, 31 59, 28 46 C 25 33, 42 23, 58 26" stroke-width="3.4"/>
    <path d="M62 70 C 54 69, 49 67, 46 64" stroke-width="2.2" opacity=".55"/>
    <path d="M58 26 C 66 27, 71 29, 74 32" stroke-width="2.2" opacity=".55"/>
    <!-- open book -->
    <path d="M60 104 C 50 96, 35 94, 18 97 L 18 80 C 35 77, 50 79, 60 88 Z" fill="#f6f1e6" stroke-width="3"/>
    <path d="M60 104 C 70 96, 85 94, 102 97 L 102 80 C 85 77, 70 79, 60 88 Z" fill="#f6f1e6" stroke-width="3"/>
    <path d="M27 86 C 37 84, 46 85, 53 89 M27 91 C 37 89, 46 90, 53 94" stroke-width="1.6" opacity=".45"/>
    <path d="M93 86 C 83 84, 74 85, 67 89 M93 91 C 83 89, 74 90, 67 94" stroke-width="1.6" opacity=".45"/>
  </g>
  <!-- the point -->
  <circle cx="60" cy="48" r="5.2" fill="#c08a2c"/>
  <circle cx="60" cy="48" r="9" fill="#c08a2c" opacity=".18"/>
  <!-- guiding star -->
  <path d="M98 8 Q 99.6 17.4 109 19 Q 99.6 20.6 98 30 Q 96.4 20.6 87 19 Q 96.4 17.4 98 8 Z" fill="#b3362b"/>
  <!-- distant stars -->
  <g fill="#1f2a44">
    <circle cx="20" cy="22" r="1.6"/>
    <circle cx="13" cy="58" r="1.3" opacity=".7"/>
    <circle cx="80" cy="14" r="1.2" opacity=".7"/>
    <circle cx="108" cy="60" r="1.4" opacity=".8"/>
  </g>
</svg>
